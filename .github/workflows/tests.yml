name: Tests and governance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.16.5
      - run: python devtools/validate_governance.py
      - run: ruff check .
      - run: ruff format --check .
      - name: Check out the reviewed MOLI governance core
        uses: actions/checkout@v4
        with:
          repository: uibcdf/moli
          ref: 4316867722f259fdf77f4d7d5e6e2c093ff95d04
          path: .moli-governance
      - name: Check shared MOLI governance core
        run: >-
          python .moli-governance/devtools/scripts/check_repository.py .
          --canonical-guide .moli-governance/MOLI_GUIDE.md
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools wheel pytest pytest-receptor==1.1.0
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Test installed package
        run: python -m pytest --receptor=ci -o pythonpath=''
  smonitor-recovery:
    name: SMonitor recovery / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      RECORDA_TEST_SMONITOR: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/.smonitor-provider
    steps:
      - uses: actions/checkout@v4
      - name: Check out the resolved SMonitor APIs (unreleased development route)
        uses: actions/checkout@v4
        with:
          repository: uibcdf/smonitor
          ref: 6feac9728cc35d57cbc92f284d7040d7f04cb35b
          path: .smonitor-provider
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools wheel pytest pytest-receptor==1.1.0
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify the provider source identity
        run: >-
          test "$(git -C .smonitor-provider rev-parse HEAD)" =
          "6feac9728cc35d57cbc92f284d7040d7f04cb35b"
      - name: Test installed Recorda with pinned SMonitor source
        run: python -m pytest -p pytest_receptor.plugin --receptor=ci -o pythonpath=''
  argdigest-configuration:
    name: ArgDigest configuration / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      RECORDA_TEST_ARGDIGEST: '1'
      RECORDA_TEST_SMONITOR: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/.argdigest-provider:${{ github.workspace }}/.smonitor-provider
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Check out resolved ArgDigest APIs (unreleased development route)
        uses: actions/checkout@v4
        with:
          repository: uibcdf/argdigest
          ref: 5e7925ddcd14922d00647d39b6a97eed2499bc23
          path: .argdigest-provider
      - name: Check out resolved SMonitor APIs (unreleased development route)
        uses: actions/checkout@v4
        with:
          repository: uibcdf/smonitor
          ref: 6feac9728cc35d57cbc92f284d7040d7f04cb35b
          path: .smonitor-provider
      - name: Provision published DepDigest closure from Conda
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: recorda-argdigest
          create-args: >-
            python=${{ matrix.python }}
            depdigest=0.13.0 smonitor=0.18.0
            pip setuptools wheel pytest
            --channel uibcdf --channel conda-forge --strict-channel-priority
      - run: python -m pip install pytest-receptor==1.1.0
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify provider source identities
        run: |
          test "$(git -C .argdigest-provider rev-parse HEAD)" = "5e7925ddcd14922d00647d39b6a97eed2499bc23"
          test "$(git -C .smonitor-provider rev-parse HEAD)" = "6feac9728cc35d57cbc92f284d7040d7f04cb35b"
      - name: Test installed Recorda with pinned configuration providers
        run: python -m pytest -p pytest_receptor.plugin --receptor=ci -o pythonpath=''
