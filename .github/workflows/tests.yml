name: Tests and governance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.16.5
      - run: python devtools/validate_governance.py
      - run: ruff check .
      - run: ruff format --check .
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: macos-latest
            python: '3.11'
          - os: macos-latest
            python: '3.12'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools wheel pytest pytest-receptor==1.1.0
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Test installed package
        run: python -m pytest --receptor=ci -o pythonpath=''
