name: Tests and governance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * 1'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.16.5 PyYAML==6.0.3 packaging
      - run: python devtools/check_dependencies.py
      - run: python devtools/validate_governance.py
      - run: ruff check .
      - run: ruff format --check .
      - name: Check out the reviewed MOLI governance core
        uses: actions/checkout@v4
        with:
          repository: uibcdf/moli
          ref: 4316867722f259fdf77f4d7d5e6e2c093ff95d04
          path: .moli-governance
      - name: Check shared MOLI governance core
        run: >-
          python .moli-governance/devtools/scripts/check_repository.py .
          --canonical-guide .moli-governance/MOLI_GUIDE.md
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          create-args: python=${{ matrix.python }} --strict-channel-priority
      - run: python -m pip install pytest-receptor==1.1.0
      - run: python devtools/check_dependencies.py
      - run: python devtools/verify_support_environment.py argdigest
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - name: Verify tested architecture
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: >-
          python -c "import os, platform;
          assert not os.environ['EXPECTED_OS'].startswith('macos-') or platform.machine() == 'arm64';
          print(platform.system(), platform.machine())"
      - name: Test installed package
        run: python -m pytest --receptor=ci -o pythonpath=''
  smonitor-recovery:
    name: SMonitor recovery / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      RECORDA_TEST_SMONITOR: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - name: Provision published SMonitor from Conda
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/recovery_test_env.yaml
          create-args: python=${{ matrix.python }} --strict-channel-priority
      - run: python -m pip install pytest-receptor==1.1.0
      - run: python devtools/check_dependencies.py
      - name: Verify the published provider and feature contract
        run: python devtools/verify_support_environment.py smonitor
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - name: Test installed Recorda with published SMonitor
        run: python -m pytest -p pytest_receptor.plugin --receptor=ci -o pythonpath=''
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RECORDA_TEST_SMONITOR: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          create-args: python=3.14 --strict-channel-priority
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip install pytest-cov==7.0.0 coverage==7.16.2
      - run: python devtools/verify_support_environment.py argdigest
      - run: python -m pip check
      - name: Measure required runtime and recovery tests
        run: |
          python -m pytest -p pytest_receptor.plugin -p pytest_cov.plugin --receptor=ci -o pythonpath='' --cov=recorda --cov-branch --cov-report=term --cov-report="xml:$RUNNER_TEMP/coverage.xml"
          python - <<'PY'
          import pathlib, recorda, os
          from devtools.release_candidate import ROOT, coverage_paths, sha256
          runtime = {p.relative_to(ROOT / 'src').as_posix(): sha256(p) for p in (ROOT / 'src/recorda').rglob('*.py')}
          package_root = pathlib.Path(recorda.__file__).parent.parent
          assert all(sha256(package_root / relative) == expected for relative, expected in runtime.items())
          coverage_paths(pathlib.Path(os.environ['RUNNER_TEMP']) / 'coverage.xml', {'runtime_sha256': runtime})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-coverage
          path: ${{ runner.temp }}/coverage.xml
          if-no-files-found: error
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ${{ runner.temp }}/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
