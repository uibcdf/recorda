name: Latest public support providers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 2'

permissions:
  contents: read

jobs:
  latest:
    name: Latest providers / ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      RECORDA_TEST_SMONITOR: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install packaging
      - name: Select stable providers from the public main channel
        id: selected
        run: >-
          python -m devtools.latest_support select
          --output "$RUNNER_TEMP/latest-providers.json"
          --github-output "$GITHUB_OUTPUT"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/latest_support_env.yaml
          create-args: >-
            python=3.14 ${{ steps.selected.outputs.specs }} --strict-channel-priority
      - run: python devtools/check_dependencies.py
      - name: Verify selected public provider identities and installed Python bytes
        run: >-
          python -m devtools.latest_support verify
          --manifest "$RUNNER_TEMP/latest-providers.json"
          > "$RUNNER_TEMP/latest-provider-installation.json"
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - name: Verify installed runtime and architecture
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          python - <<'PY'
          import os, pathlib, platform, recorda, sysconfig
          from devtools.release_candidate import ROOT, sha256
          assert pathlib.Path(recorda.__file__).resolve().is_relative_to(pathlib.Path(sysconfig.get_path('purelib')).resolve())
          assert os.environ['EXPECTED_OS'] != 'macos-latest' or platform.machine() == 'arm64'
          package_root = pathlib.Path(recorda.__file__).parent.parent
          assert all(sha256(p) == sha256(package_root / p.relative_to(ROOT / 'src')) for p in (ROOT / 'src/recorda').rglob('*.py'))
          print(platform.system(), platform.machine(), recorda.__file__)
          PY
      - name: Test installed Recorda with the selected latest providers
        run: >-
          python -m pytest -p pytest_receptor.plugin --receptor=ci -o pythonpath=''
          --receptor-events="$RUNNER_TEMP/latest-tests.jsonl"
          --junitxml="$RUNNER_TEMP/latest-tests.xml"
      - name: Retain selection, installed identities and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-support-${{ matrix.os }}-py314
          path: |
            ${{ runner.temp }}/latest-providers.json
            ${{ runner.temp }}/latest-provider-installation.json
            ${{ runner.temp }}/latest-tests.jsonl
            ${{ runner.temp }}/latest-tests.xml
          if-no-files-found: warn
