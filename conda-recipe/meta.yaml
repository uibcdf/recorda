# Local source-development recipe. It is not a qualified public release candidate.
package:
  name: recorda
  version: 0.2.0
source:
  path: ..
build:
  number: 0
  noarch: python
  script: python -m pip install --no-deps --no-build-isolation .
requirements:
  host:
    - python >=3.11,<3.15
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.11,<3.15
    - argdigest >=0.15.0,<0.16
    - smonitor >=0.19.0,<0.20
test:
  imports:
    - recorda
  commands:
    - python -c "import recorda; assert recorda.CapturePolicy(['b','a']).profiles == ('a','b')"
about:
  home: https://github.com/uibcdf/recorda
  license: MIT
  license_file: LICENSE
  summary: Experimental standalone scientific recording and provenance
