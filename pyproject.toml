[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recorda"
version = "0.2.0"
description = "Experimental standalone scientific recording and provenance"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
smonitor = ["smonitor>=0.19.0,<0.20"]
argdigest = ["argdigest>=0.15.0,<0.16", "smonitor>=0.19.0,<0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["MOLI_GUIDE.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
